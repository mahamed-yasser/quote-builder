<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quote Builder</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div><h1>Quote Builder</h1><p class="sub">Build a price quote for a client, save templates, copy it as a message or print to PDF. Data stays in this browser.</p></div><div class="actions noprint"><button class="ghost" id="copy">Copy as text</button><button class="btn" id="print">Print / Save PDF</button></div></header>
<main><div class="grid2"><section class="panel noprint"><h2>Quote</h2>
<div class="row"><label>Your name<input id="from" maxlength="60"></label><label>Client<input id="to" maxlength="60"></label></div>
<div class="row"><label>Title<input id="title" maxlength="80" value="Website project"></label><label>Valid for (days)<input id="valid" inputmode="numeric" value="14"></label><label>Currency<select id="cur"><option value="$">USD $</option><option value="€">EUR €</option><option value="£">GBP £</option><option value="EGP ">EGP</option></select></label></div>
<h2>Items</h2><div id="items"></div><button class="ghost" id="add" type="button">+ Add item</button>
<div class="row" style="margin-top:.8rem"><label>Discount %<input id="disc" inputmode="decimal" value="0"></label><label>Tax %<input id="tax" inputmode="decimal" value="0"></label></div>
<label>Terms<textarea id="terms" rows="3">50% upfront, balance on delivery. Changes outside this scope are quoted separately.</textarea></label><p class="err" id="err" role="alert" hidden></p>
<h2>Templates</h2><div class="row"><label>Template name<input id="tname" maxlength="40"></label><label>Saved templates<select id="tsel"></select></label></div><div class="actions"><button class="ghost" id="tsave" type="button">Save template</button><button class="ghost" id="tload" type="button">Load</button><button class="ghost" id="tdel" type="button">Delete</button></div></section>
<section class="panel" id="paper"><h2 id="pTitle"></h2><p class="mut" id="pMeta"></p><div class="tablewrap"><table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Total</th></tr></thead><tbody id="pRows"></tbody></table></div>
<dl style="margin:1rem 0 0 auto;max-width:280px"><div style="display:flex;justify-content:space-between"><dt>Subtotal</dt><dd id="tSub" style="margin:0"></dd></div><div style="display:flex;justify-content:space-between"><dt id="tDL">Discount</dt><dd id="tDisc" style="margin:0"></dd></div><div style="display:flex;justify-content:space-between"><dt id="tTL">Tax</dt><dd id="tTax" style="margin:0"></dd></div><div style="display:flex;justify-content:space-between;font-weight:800;border-top:2px solid #0f172a;margin-top:.3rem;padding-top:.3rem"><dt>Total</dt><dd id="tTot" style="margin:0"></dd></div></dl><p class="mut" id="pTerms"></p></section></div></main>
<footer>Local tool. Prices are your own input; check them before sending.</footer>
<script src="util.js"></script><script src="app.js"></script></body></html>
